[project]
name = "aletheiaAI"
version = "0.1.0"
description = "Bug bounty meta-orchestrator: scanner, analyzer, conviction engine, reporter"
requires-python = ">=3.10"
dependencies = [
    "slither-analyzer>=0.10.0",
]

[project.scripts]
aletheia = "aletheia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aletheia*"]

[tool.pytest.ini_options]
testpaths = ["aletheia/tests"]
